name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  ubuntu-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxfixes-dev \
            libegl1-mesa-dev \
            libvulkan-dev \
            libmpv-dev

      - name: Run checks
        run: make check GO=go

  windows-latest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and vet
        env:
          CGO_ENABLED: 0
        run: |
          go build ./cmd/lighttube
          go vet ./...

  macos-latest:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./cmd/lighttube

      - name: Test non-GUI packages
        run: go test -v ./internal/player ./internal/store ./internal/yt ./internal/platform ./internal/thumbs
